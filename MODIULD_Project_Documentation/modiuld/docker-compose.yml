version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend:/var/www/html/frontend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - modiuld_net

  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend/src:/var/www/html/backend
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: modiuld
      DB_USER: modiuld_user
      DB_PASS: modiuld_pass
      JWT_SECRET: modiuld_super_secret_jwt_key_2026
    depends_on:
      db:
        condition: service_healthy
    networks:
      - modiuld_net

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: modiuld
      MYSQL_USER: modiuld_user
      MYSQL_PASSWORD: modiuld_pass
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - modiuld_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: modiuld_user
      PMA_PASSWORD: modiuld_pass
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - modiuld_net

volumes:
  db_data:

networks:
  modiuld_net:
    driver: bridge
