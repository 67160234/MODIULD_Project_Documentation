<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register — MODIULD</title>
<meta name="description" content="Create your MODIULD account.">
<link rel="icon" href="/frontend/assets/icon1.png">
<link rel="stylesheet" href="/frontend/css/style.css?v=3">
<script src="/frontend/js/auth.js?v=3" defer></script>
</head>
<body class="auth-body">
<nav class="navbar">
  <div class="navbar-logo"><img src="/frontend/assets/icon1.png" alt="MODIULD"></div>
  <ul class="navbar-nav">
    <li><a href="/login.html">Sign in</a></li>
    <li><a href="/register.html">Register</a></li>
  </ul>
</nav>
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="/frontend/assets/Moduild_logo.png" alt="MODIULD">
    </div>
    <div id="reg-alert" class="alert hidden"></div>
    <form id="register-form" novalidate>
      <div class="form-group">
        <input type="text" id="reg-username" class="form-control" placeholder="กรอก Username (ภาษาอังกฤษ/ตัวเลข)" autocomplete="username" required>
      </div>
      <div class="form-group">
        <input type="email" id="reg-email" class="form-control" placeholder="กรอกอีเมล" autocomplete="email" required>
      </div>
      <div class="form-group">
        <input type="password" id="reg-password" class="form-control" placeholder="รหัสผ่าน" autocomplete="new-password" required>
        <span class="password-toggle" onclick="togglePass('reg-password', this)">SHOW</span>
      </div>
      <div class="form-group">
        <input type="password" id="reg-confirm" class="form-control" placeholder="กรอกรหัสผ่านอีกครั้ง" autocomplete="new-password" required>
        <span class="password-toggle" onclick="togglePass('reg-confirm', this)">SHOW</span>
      </div>
      <button type="button" class="btn-google" id="btn-google">
        <svg viewBox="0 0 48 48" width="20" height="20"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.2l6.8-6.8C35.8 2.4 30.2 0 24 0 14.7 0 6.7 5.4 2.7 13.2l7.9 6.1C12.5 13.1 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.5 2.8-2.1 5.1-4.4 6.7l7 5.4c4.1-3.8 6.5-9.4 6.5-16.1z"/><path fill="#FBBC05" d="M10.6 28.6A14.6 14.6 0 0 1 9.5 24c0-1.6.3-3.1.7-4.6L2.3 13.2A24 24 0 0 0 0 24c0 3.9.9 7.5 2.7 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 12-2.1 15.9-5.8l-7-5.4c-2 1.3-4.5 2.1-8.9 2.1-6.2 0-11.5-3.6-13.4-9l-7.9 6.2C6.7 42.6 14.7 48 24 48z"/></svg>
        Sign in with Google
      </button>
      <button type="submit" class="btn-primary" id="btn-register">Register</button>
    </form>
    <div class="auth-links">
      <a href="/login.html" id="link-signin">Sign in</a>
    </div>
  </div>
</div>
<script>
function togglePass(id, btn) {
  const el = document.getElementById(id);
  if(el.type === 'password') { el.type = 'text'; btn.textContent = 'HIDE'; }
  else { el.type = 'password'; btn.textContent = 'SHOW'; }
}
document.addEventListener('DOMContentLoaded', () => {
  Auth.redirectIfLoggedIn();
  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alert = document.getElementById('reg-alert');
    const username = document.getElementById('reg-username').value.trim();
    const email   = document.getElementById('reg-email').value.trim();
    const pass    = document.getElementById('reg-password').value;
    const confirm = document.getElementById('reg-confirm').value;
    const btn     = document.getElementById('btn-register');
    btn.disabled = true; btn.textContent = 'Creating account...';
    const r = await Auth.register(email, username, pass, confirm, '');
    btn.disabled = false; btn.textContent = 'Register';
    if (r.ok) { showAlert(alert, 'Account created! Redirecting...', 'success'); setTimeout(() => window.location.href = '/dashboard.html', 1200); }
    else { showAlert(alert, r.data.error || 'Registration failed.'); }
  });
  document.getElementById('btn-google').addEventListener('click', () => {
    showAlert(document.getElementById('reg-alert'), 'Google Sign-In is not yet available.', 'error');
  });
});
</script>
</body>
</html>
