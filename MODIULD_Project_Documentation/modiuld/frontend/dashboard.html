<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Loadout — MODIULD</title>
<link rel="icon" href="/frontend/assets/icon1.png">
<link rel="stylesheet" href="/frontend/css/style.css?v=3">
<script src="/frontend/js/auth.js?v=3" defer></script>
<script src="/frontend/js/app.js?v=3" defer></script>
</head>
<body>
<div class="app-layout">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="/frontend/assets/Moduild_logo.png" alt="MODIULD" class="logo-text" style="width:130px">
      <div class="avatar" id="sidebar-avatar" title="Account">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      </div>
    </div>
    <!-- Account popup -->
    <div class="account-popup" id="account-popup">
      <span class="popup-close" id="popup-close">&#10005;</span>
      <p class="popup-title">Account</p>
      <ul class="popup-list">
        <li><a href="#" id="btn-switch-account">Switch account</a></li>
        <li><a href="#" id="btn-logout">Logout</a></li>
      </ul>
      <p class="popup-title">Setting</p>
      <div class="toggle-row"><span>Color Mode</span><label class="toggle"><input type="checkbox" id="toggle-color" checked><span class="toggle-slider"></span></label></div>
      <div class="toggle-row"><span>Light Mode</span><label class="toggle"><input type="checkbox" id="toggle-light"><span class="toggle-slider"></span></label></div>
      <div class="toggle-row"><span>Dark Mode</span><label class="toggle"><input type="checkbox" id="toggle-dark" checked><span class="toggle-slider"></span></label></div>
    </div>
    <p class="sidebar-section-title">Menu</p>
    <ul class="sidebar-nav"><li><a href="/dashboard.html" class="active" id="nav-loadout">Your Loadout</a></li></ul>
    <p class="sidebar-section-title">Loadouts</p>
    <ul class="sidebar-nav" id="sidebar-loadout-list"></ul>
    <button class="btn-create-loadout" id="btn-create-new" onclick="window.location.href='/create-loadout.html'">+ Create New Loadout</button>
    <div class="sidebar-footer"><span class="lang-badge" id="lang-badge">EN</span></div>
  </aside>
  <!-- MAIN -->
  <main class="main-content">
    <h1 class="page-title">Your Loadout</h1>
    <p class="page-subtitle" id="dash-subtitle">Select a loadout to open a workspace or create a new one.</p>
    <div id="alert-area" class="alert hidden" style="max-width:600px;margin-bottom:16px"></div>
    <div class="loadout-grid" id="loadout-grid">
      <div style="color:var(--text-muted);font-size:.9rem">Loading...</div>
    </div>
  </main>
</div>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  initAccountPopup();
  const user = Auth.getUser();
  if (user) document.getElementById('dash-subtitle').textContent = 'Select a loadout to open a workspace or create a new one.';
  else document.getElementById('dash-subtitle').textContent = 'You are browsing as Guest. Register to save unlimited Loadouts.';

  const loadouts = await App.getLoadouts();
  const sidebar  = document.getElementById('sidebar-loadout-list');
  const grid     = document.getElementById('loadout-grid');
  sidebar.innerHTML = '';
  grid.innerHTML    = '';

  loadouts.forEach(l => {
    // Sidebar item
    const li = document.createElement('li');
    li.innerHTML = `<a href="/workspace.html?id=${l.id}">${escHtml(l.name)}</a>`;
    sidebar.appendChild(li);
    // Grid card
    const card = document.createElement('div');
    card.className = 'loadout-card';
    card.innerHTML = `
      <div class="loadout-card-thumb">
        <div class="thumb-placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12h8M8 8h8M8 16h5"/></svg>
        </div>
      </div>
      <span class="loadout-card-name" title="${escHtml(l.name)}">${escHtml(l.name)}</span>
      <div class="loadout-card-actions">
        <button class="btn-view" onclick="window.location.href='/workspace.html?id=${l.id}'">View</button>
        <button class="btn-edit-sm" onclick="window.location.href='/create-loadout.html?edit=${l.id}'">Edit</button>
      </div>`;
    grid.appendChild(card);
  });

  // "+ Create New Loadout" card always last
  const addCard = document.createElement('div');
  addCard.className = 'loadout-card';
  addCard.style.cursor = 'pointer';
  addCard.onclick = () => window.location.href = '/create-loadout.html';
  addCard.innerHTML = `
    <div class="loadout-card-thumb" style="background:rgba(10,5,25,0.9)">
      <span class="plus-icon">&#43;</span>
    </div>
    <span class="loadout-card-name">Create New Loadout</span>`;
  grid.appendChild(addCard);
});

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
