<!DOCTYPE html>
<html lang="en" class="theme-default" data-theme="default">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Loadout — MODIULD</title>
<link rel="icon" href="/frontend/assets/icon1.png">
<link rel="stylesheet" href="/frontend/css/style.css?v=3">
<script src="/frontend/js/theme.js?v=3" defer></script>
<script src="/frontend/js/auth.js?v=3" defer></script>
<script src="/frontend/js/app.js?v=3" defer></script>
<script src="/frontend/js/version.js?v=3" defer></script>
<script src="/frontend/js/lang.js?v=3" defer></script>

</head>
<body>
<div class="app-layout">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="/frontend/assets/Moduild_logo.png" alt="MODIULD" class="logo-text" style="width:130px">
      <div class="avatar" id="sidebar-avatar" title="Account">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      </div>
    </div>
    <!-- Account popup -->
    <div class="account-popup" id="account-popup">
      <span class="popup-close" id="popup-close">&#10005;</span>
      <p class="popup-title" data-i18n="account">Account</p>
      <ul class="popup-list">
        <li><a href="#" id="btn-switch-account" data-i18n="switch_account">Switch account</a></li>
        <li><a href="#" id="btn-logout" data-i18n="logout">Logout</a></li>
      </ul>
      <p class="popup-title" data-i18n="color_mode">Color Mode</p>
      <div class="theme-radio-group" id="theme-radio-group">
        <label class="theme-radio-btn" id="lbl-color">
          <input type="radio" name="popup-theme" value="default" id="radio-default">
          <span data-i18n="default">Default</span>
        </label>
        <label class="theme-radio-btn" id="lbl-light">
          <input type="radio" name="popup-theme" value="light" id="radio-light">
          <span data-i18n="light">Light</span>
        </label>
        <label class="theme-radio-btn" id="lbl-dark">
          <input type="radio" name="popup-theme" value="dark" id="radio-dark">
          <span data-i18n="dark">Dark</span>
        </label>
      </div>
      <a href="/settings.html" class="popup-settings-link" data-i18n="color_settings">Color Settings</a>
    </div>
    <p class="sidebar-section-title" data-i18n="menu">Menu</p>
    <ul class="sidebar-nav"><li><a href="/dashboard.html" class="active" id="nav-loadout" data-i18n="your_loadout">Your Loadout</a></li></ul>
    <p class="sidebar-section-title" data-i18n="loadouts">Loadouts</p>
    <ul class="sidebar-nav" id="sidebar-loadout-list"></ul>
    <button class="btn-create-loadout" id="btn-create-new" data-i18n="create_new_loadout" onclick="window.location.href='/create-loadout.html'">+ Create New Loadout</button>
    <div class="sidebar-footer"><span class="lang-badge" id="lang-badge">EN</span></div>
  </aside>
  <!-- MAIN -->
  <main class="main-content">
    <h1 class="page-title" data-i18n="your_loadout">Your Loadout</h1>
    <p class="page-subtitle" id="dash-subtitle" data-i18n="dashboard_subtitle">Select a loadout to open a workspace or create a new one.</p>
    <div id="alert-area" class="alert hidden" style="max-width:600px;margin-bottom:16px"></div>
    <div class="loadout-grid" id="loadout-grid">
      <div style="color:var(--text-muted);font-size:.9rem">Loading...</div>
    </div>
  </main>
</div>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  initAccountPopup();
  const user = Auth.getUser();
  if (user) document.getElementById('dash-subtitle').textContent = 'Select a loadout to open a workspace or create a new one.';
  else document.getElementById('dash-subtitle').textContent = 'You are browsing as Guest. Register to save unlimited Loadouts.';

  const loadouts = await App.getLoadouts();
  const sidebar  = document.getElementById('sidebar-loadout-list');
  const grid     = document.getElementById('loadout-grid');
  sidebar.innerHTML = '';
  grid.innerHTML    = '';

  loadouts.forEach(l => {
    // Sidebar item
    const li = document.createElement('li');
    li.innerHTML = `<a href="/workspace.html?id=${l.id}">${escHtml(l.name)}</a>`;
    sidebar.appendChild(li);
    // Grid card
    const card = document.createElement('div');
    card.className = 'loadout-card';
    card.innerHTML = `
      <div class="loadout-card-thumb">
        <div class="thumb-placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12h8M8 8h8M8 16h5"/></svg>
        </div>
      </div>
      <span class="loadout-card-name" title="${escHtml(l.name)}">${escHtml(l.name)}</span>
      <div class="loadout-card-actions">
        <button class="btn-view" onclick="window.location.href='/workspace.html?id=${l.id}'">View</button>
        <button class="btn-edit-sm" onclick="window.location.href='/create-loadout.html?edit=${l.id}'">Edit</button>
      </div>`;
    grid.appendChild(card);
  });

  // "+ Create New Loadout" card always last
  const addCard = document.createElement('div');
  addCard.className = 'loadout-card';
  addCard.style.cursor = 'pointer';
  addCard.onclick = () => window.location.href = '/create-loadout.html';
  addCard.innerHTML = `
    <div class="loadout-card-thumb" style="background:rgba(10,5,25,0.9)">
      <span class="plus-icon">&#43;</span>
    </div>
    <span class="loadout-card-name">Create New Loadout</span>`;
  grid.appendChild(addCard);
});

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Theme radio picker in popup ──────────────────────────────────
(function () {
  const VALID = ['default', 'light', 'dark'];
  function applyTheme(name) {
    const html = document.documentElement;
    html.classList.remove('theme-default', 'theme-light', 'theme-dark');
    html.classList.add('theme-' + name);
    html.setAttribute('data-theme', name);
    localStorage.setItem('modiuld_theme', name);
  }
  // Sync radio to saved theme when popup opens
  const observer = new MutationObserver(() => {
    const saved = localStorage.getItem('modiuld_theme') || 'default';
    const radio = document.getElementById('radio-' + saved);
    if (radio) radio.checked = true;
  });
  const popup = document.getElementById('account-popup');
  if (popup) observer.observe(popup, { attributes: true, attributeFilter: ['class', 'style'] });

  // Apply immediately on selection – one radio at a time (enforced by name="popup-theme")
  document.querySelectorAll('input[name="popup-theme"]').forEach(r => {
    r.addEventListener('change', () => { if (VALID.includes(r.value)) applyTheme(r.value); });
  });

  // Initial sync on load
  const saved = localStorage.getItem('modiuld_theme') || 'default';
  const initRadio = document.getElementById('radio-' + saved);
  if (initRadio) initRadio.checked = true;
})();
</script>
<div id="version-badge" class="version-badge"></div>
</body>
</html>
