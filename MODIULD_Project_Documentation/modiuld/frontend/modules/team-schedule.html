<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Schedule — MODIULD</title>
<link rel="icon" href="/frontend/assets/icon1.png">
<link rel="stylesheet" href="/frontend/css/style.css?v=3">
<script src="/frontend/js/auth.js?v=3" defer></script>
<style>
.module-layout{display:flex;gap:24px;}
.module-col{flex:1;background:rgba(10,8,30,0.6);border:1.5px solid rgba(124,58,237,0.3);border-radius:var(--radius-md);padding:24px;}
</style>
</head>
<body class="module-body">
<div class="module-page">
  <div class="module-header">
    <button class="btn-back" onclick="history.back()">&#8592; Back to Workspace</button>
    <h1 class="module-page-title">Team Schedule</h1>
  </div>
  <div id="alert-area" class="alert hidden"></div>
  <div class="module-layout">
    <div class="module-col" style="flex:1">
      <h3 style="margin-bottom:16px">Add Schedule</h3>
      <form onsubmit="addSchedule(event)">
        <div class="form-group">
          <label style="display:block;margin-bottom:4px;font-size:.9rem;color:var(--text-muted)">Event Title</label>
          <input type="text" id="s-title" class="form-control" required placeholder="e.g. Design Review">
        </div>
        <div class="form-group">
          <label style="display:block;margin-bottom:4px;font-size:.9rem;color:var(--text-muted)">Date</label>
          <input type="date" id="s-date" class="form-control" required>
        </div>
        <div class="form-group">
          <label style="display:block;margin-bottom:4px;font-size:.9rem;color:var(--text-muted)">Person/Team</label>
          <input type="text" id="s-person" class="form-control" required placeholder="e.g. UI Team">
        </div>
        <button type="submit" class="btn-primary">Add Event</button>
      </form>
    </div>
    
    <div class="module-col" style="flex:2">
      <h3 style="margin-bottom:16px">Upcoming Schedule</h3>
      <table class="data-table" id="table-schedule">
        <thead><tr><th>Date</th><th>Event</th><th>Person/Team</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>
<script>
let schedule = [
  { date: '2026-10-15', title: 'Sprint Planning', person: 'Dev Team' },
  { date: '2026-10-16', title: 'Design Review', person: 'UI Team' }
];

function render() {
  const tbody = document.querySelector('#table-schedule tbody');
  schedule.sort((a,b)=>a.date.localeCompare(b.date));
  tbody.innerHTML = schedule.map(s => `<tr>
    <td style="font-weight:600;color:var(--text-muted)">${s.date}</td>
    <td>${s.title}</td>
    <td><span class="badge badge-purple">${s.person}</span></td>
  </tr>`).join('');
}
function addSchedule(e) {
  e.preventDefault();
  const title = document.getElementById('s-title').value;
  const date = document.getElementById('s-date').value;
  const person = document.getElementById('s-person').value;
  schedule.push({ date, title, person });
  e.target.reset(); render();
}
render();
</script>
</body>
</html>
