<!DOCTYPE html>
<html lang="en" class="theme-default" data-theme="default">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asset Tracking — MODIULD</title>
<link rel="icon" href="/frontend/assets/icon1.png">
<link rel="stylesheet" href="/frontend/css/style.css?v=3">
<script src="/frontend/js/theme.js?v=3" defer></script>
<script src="/frontend/js/auth.js?v=3" defer></script>
<script src="/frontend/js/version.js?v=3" defer></script>

</head>
<body class="module-body">
<div class="module-page">
  <div class="module-header">
    <button class="btn-back" onclick="history.back()">&#8592; Back to Workspace</button>
    <h1 class="module-page-title">Asset Tracking</h1>
  </div>
  <div id="alert-area" class="alert hidden"></div>
  <div class="module-layout">
    <div class="module-col" style="flex:1">
      <h3 style="margin-bottom:16px">Add Asset</h3>
      <form onsubmit="addAsset(event)">
        <div class="form-group">
          <label style="display:block;margin-bottom:4px;font-size:.9rem;color:var(--text-muted)">Asset Name</label>
          <input type="text" id="a-name" class="form-control" required placeholder="e.g. MacBook Pro M2">
        </div>
        <div class="form-group">
          <label style="display:block;margin-bottom:4px;font-size:.9rem;color:var(--text-muted)">Location</label>
          <input type="text" id="a-loc" class="form-control" required placeholder="e.g. IT Dept">
        </div>
        <div class="form-group">
          <label style="display:block;margin-bottom:4px;font-size:.9rem;color:var(--text-muted)">Status</label>
          <select id="a-status" class="form-control" required>
            <option value="available">Available</option>
            <option value="in-use">In-Use</option>
            <option value="maintenance">Maintenance</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">Add Asset</button>
      </form>
    </div>
    <div class="module-col" style="flex:2">
      <h3 style="margin-bottom:16px">Asset Inventory</h3>
      <table class="data-table" id="table-assets">
        <thead><tr><th>Code</th><th>Name</th><th>Location</th><th>Status</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>
<script>
let assets = [
  { code: 'AST-001', name: 'MacBook Pro M2', loc: 'IT Dept', status: 'in-use' },
  { code: 'AST-002', name: 'Projector', loc: 'Meeting Room A', status: 'available' }
];
let counter = 3;
function getBadge(status) {
  if (status==='available') return 'badge-green';
  if (status==='in-use') return 'badge-blue';
  return 'badge-yellow';
}
function render() {
  const tbody = document.querySelector('#table-assets tbody');
  tbody.innerHTML = assets.map(a => `<tr>
    <td style="font-weight:600;color:var(--text-muted)">${a.code}</td>
    <td>${a.name}</td><td>${a.loc}</td>
    <td><span class="badge ${getBadge(a.status)}">${a.status}</span></td>
  </tr>`).join('');
}
function addAsset(e) {
  e.preventDefault();
  const name = document.getElementById('a-name').value;
  const loc = document.getElementById('a-loc').value;
  const status = document.getElementById('a-status').value;
  assets.push({ code: 'AST-00' + counter++, name, loc, status });
  e.target.reset();
  render();
  const alert = document.getElementById('alert-area');
  alert.textContent = 'Asset added successfully!';
  alert.className = 'alert alert-success';
  setTimeout(()=>alert.classList.add('hidden'),3000);
}
render();
</script>
<div id="version-badge" class="version-badge"></div>
</body>
</html>
