<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seat Allocation — MODIULD</title>
<link rel="icon" href="/frontend/assets/icon1.png">
<link rel="stylesheet" href="/frontend/css/style.css?v=3">
<script src="/frontend/js/auth.js?v=3" defer></script>
<style>
.module-layout{display:flex;gap:24px;}
.module-col{flex:1;background:rgba(10,8,30,0.6);border:1.5px solid rgba(124,58,237,0.3);border-radius:var(--radius-md);padding:24px;}
.seat-grid {display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;}
.seat {padding:16px; border-radius:var(--radius-sm); border:2px solid var(--border-card); text-align:center; font-weight:700; cursor:pointer; transition:all .2s;}
.seat:hover {border-color:var(--accent-teal);}
.seat.occupied {background: rgba(139,92,246,0.3); border-color: rgba(139,92,246,0.5);}
.seat.available {background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.3);}
</style>
</head>
<body class="module-body">
<div class="module-page">
  <div class="module-header">
    <button class="btn-back" onclick="history.back()">&#8592; Back to Workspace</button>
    <h1 class="module-page-title">Seat Allocation</h1>
  </div>
  <div id="alert-area" class="alert hidden"></div>
  <div class="module-layout">
    <div class="module-col" style="flex:2">
      <h3 style="margin-bottom:16px">Floor Map</h3>
      <div class="seat-grid" id="seat-grid"></div>
    </div>
    <div class="module-col" style="flex:1">
      <h3 style="margin-bottom:16px">Assign Seat</h3>
      <form id="seat-form" onsubmit="assignSeat(event)">
        <div class="form-group">
          <label style="display:block;margin-bottom:4px;font-size:.9rem;color:var(--text-muted)">Selected Seat</label>
          <input type="text" id="s-label" class="form-control" readonly placeholder="Click a seat">
        </div>
        <div class="form-group">
          <label style="display:block;margin-bottom:4px;font-size:.9rem;color:var(--text-muted)">Assign To</label>
          <input type="text" id="s-person" class="form-control" required placeholder="Name">
        </div>
        <button type="submit" class="btn-primary" id="btn-assign" disabled>Assign</button>
        <button type="button" class="btn-reset" id="btn-clear" onclick="clearSeat()" style="width:100%; margin-top:8px; display:none;">Clear Seat</button>
      </form>
    </div>
  </div>
</div>
<script>
let seats = [];
for (let i=1; i<=12; i++) {
  seats.push({ id: 'S' + String(i).padStart(2,'0'), status: i%3===0?'occupied':'available', person: i%3===0?'John Doe':'' });
}
let selectedSeat = null;

function render() {
  const grid = document.getElementById('seat-grid');
  grid.innerHTML = seats.map(s => `
    <div class="seat ${s.status}" onclick="selectSeat('${s.id}')">
      <div>${s.id}</div>
      <div style="font-size:0.7rem;font-weight:400;margin-top:4px">${s.person || 'Available'}</div>
    </div>
  `).join('');
}
function selectSeat(id) {
  selectedSeat = seats.find(s => s.id === id);
  document.getElementById('s-label').value = selectedSeat.id;
  document.getElementById('s-person').value = selectedSeat.person;
  document.getElementById('btn-assign').disabled = false;
  document.getElementById('btn-clear').style.display = selectedSeat.status === 'occupied' ? 'block' : 'none';
}
function assignSeat(e) {
  e.preventDefault();
  if(!selectedSeat) return;
  selectedSeat.person = document.getElementById('s-person').value;
  selectedSeat.status = 'occupied';
  render(); selectSeat(selectedSeat.id);
  const alert = document.getElementById('alert-area');
  alert.textContent = 'Seat assigned.'; alert.className = 'alert alert-success'; alert.classList.remove('hidden');
}
function clearSeat() {
  if(!selectedSeat) return;
  selectedSeat.person = ''; selectedSeat.status = 'available';
  render(); selectSeat(selectedSeat.id);
}
render();
</script>
</body>
</html>
