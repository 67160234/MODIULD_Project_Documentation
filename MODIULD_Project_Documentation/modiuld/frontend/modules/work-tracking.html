<!DOCTYPE html>
<html lang="en" class="theme-default" data-theme="default">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Work Tracking — MODIULD</title>
<link rel="icon" href="/frontend/assets/icon1.png">
<link rel="stylesheet" href="/frontend/css/style.css?v=3">
<script src="/frontend/js/theme.js?v=3" defer></script>
<script src="/frontend/js/auth.js?v=3" defer></script>
<script src="/frontend/js/version.js?v=3" defer></script>

</head>
<body class="module-body">
<div class="module-page">
  <div class="module-header">
    <button class="btn-back" onclick="history.back()">&#8592; Back to Workspace</button>
    <h1 class="module-page-title">Work Tracking</h1>
  </div>
  <div class="module-layout">
    <div class="module-col" style="flex:1">
      <h3 style="margin-bottom:16px">Create Task</h3>
      <form onsubmit="addTask(event)">
        <div class="form-group">
          <label style="display:block;margin-bottom:4px;font-size:.9rem;color:var(--text-muted)">Task Title</label>
          <input type="text" id="t-title" class="form-control" required placeholder="e.g. Update UI">
        </div>
        <div class="form-group">
          <label style="display:block;margin-bottom:4px;font-size:.9rem;color:var(--text-muted)">Assignee</label>
          <input type="text" id="t-assignee" class="form-control" required>
        </div>
        <div class="form-group">
          <label style="display:block;margin-bottom:4px;font-size:.9rem;color:var(--text-muted)">Status</label>
          <select id="t-status" class="form-control" required>
            <option value="todo">To Do</option>
            <option value="in-progress">In Progress</option>
            <option value="done">Done</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">Add Task</button>
      </form>
    </div>
    
    <div class="module-col" style="flex:2">
      <h3 style="margin-bottom:16px">Task Board</h3>
      <table class="data-table" id="table-tasks">
        <thead><tr><th>Task</th><th>Assignee</th><th>Status</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>
<script>
let tasks = [
  { title: 'Update Login UI', assignee: 'John Doe', status: 'done' },
  { title: 'API Integration', assignee: 'Jane Smith', status: 'in-progress' }
];
function getBadge(status) {
  if (status==='todo') return 'badge-yellow';
  if (status==='in-progress') return 'badge-blue';
  return 'badge-green';
}
function render() {
  const tbody = document.querySelector('#table-tasks tbody');
  tbody.innerHTML = tasks.map(t => `<tr>
    <td style="font-weight:600">${t.title}</td>
    <td>${t.assignee}</td>
    <td><span class="badge ${getBadge(t.status)}">${t.status}</span></td>
  </tr>`).join('');
}
function addTask(e) {
  e.preventDefault();
  const title = document.getElementById('t-title').value;
  const assignee = document.getElementById('t-assignee').value;
  const status = document.getElementById('t-status').value;
  tasks.push({ title, assignee, status });
  e.target.reset(); render();
}
render();
</script>
<div id="version-badge" class="version-badge"></div>
</body>
</html>
