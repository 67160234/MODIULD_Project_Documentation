<!DOCTYPE html>
<html lang="en" class="theme-default" data-theme="default">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MODIULD — Modular Workflow Platform</title>
<meta name="description" content="MODIULD is a modular workflow platform. Build your own work system by selecting and combining modules into a Loadout.">
<link rel="icon" href="/frontend/assets/icon1.png">
<link rel="stylesheet" href="/frontend/css/style.css?v=3">
<script src="/frontend/js/auth.js?v=3" defer></script>
<script src="/frontend/js/version.js?v=3" defer></script>
</head>
<body class="landing-body">
<nav class="navbar">
  <div class="navbar-logo">
    <img src="/frontend/assets/icon1.png" alt="MODIULD Icon" id="nav-icon">
  </div>
  <ul class="navbar-nav">
    <li><a href="/login.html" id="nav-signin">Sign in</a></li>
    <li><a href="/register.html" id="nav-register">Register</a></li>
  </ul>
</nav>
<main class="landing-hero">
  <div class="blob-container" id="hero-blob-container">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <img src="/frontend/assets/Moduild_logo.png" alt="MODIULD" class="landing-logo-text" id="modiuld-logo">
  </div>
  <div class="landing-actions">
    <button class="btn-landing" id="btn-signin" onclick="window.location.href='/login.html'">Sign In</button>
    <button class="btn-landing" id="btn-guest" onclick="enterAsGuest()">Guest</button>
  </div>
</main>
<script>
Auth.redirectIfLoggedIn();
function enterAsGuest() {
  Auth.getGuestToken(); // ensure token exists
  window.location.href = '/dashboard.html';
}
</script>
<div id="version-badge" class="version-badge"></div>
</body>
</html>
