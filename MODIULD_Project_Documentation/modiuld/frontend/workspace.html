<!DOCTYPE html>
<html lang="en" class="theme-default" data-theme="default">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workspace — MODIULD</title>
<link rel="icon" href="/frontend/assets/icon1.png">
<link rel="stylesheet" href="/frontend/css/style.css?v=3">
<script src="/frontend/js/theme.js?v=3" defer></script>
<script src="/frontend/js/auth.js?v=3" defer></script>
<script src="/frontend/js/app.js?v=3" defer></script>
<script src="/frontend/js/version.js?v=3" defer></script>
<script src="/frontend/js/lang.js?v=3" defer></script>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="/frontend/assets/Moduild_logo.png" alt="MODIULD" class="logo-text" style="width:130px">
      <div class="avatar" id="sidebar-avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></div>
    </div>
    <div class="account-popup" id="account-popup">
      <span class="popup-close" id="popup-close">&#10005;</span>
      <p class="popup-title" data-i18n="account">Account</p>
      <ul class="popup-list"><li><a href="#" id="btn-logout" data-i18n="logout">Logout</a></li></ul>
      <p class="popup-title" data-i18n="color_mode">Color Mode</p>
      <div class="theme-radio-group" id="theme-radio-group">
        <label class="theme-radio-btn" id="lbl-color">
          <input type="radio" name="popup-theme" value="default" id="radio-default">
          <span data-i18n="default">Default</span>
        </label>
        <label class="theme-radio-btn" id="lbl-light">
          <input type="radio" name="popup-theme" value="light" id="radio-light">
          <span data-i18n="light">Light</span>
        </label>
        <label class="theme-radio-btn" id="lbl-dark">
          <input type="radio" name="popup-theme" value="dark" id="radio-dark">
          <span data-i18n="dark">Dark</span>
        </label>
      </div>
      <a href="/settings.html" class="popup-settings-link" data-i18n="color_settings">Color Settings</a>
    </div>
    <p class="sidebar-section-title" data-i18n="menu">Menu</p>
    <ul class="sidebar-nav"><li><a href="/dashboard.html" data-i18n="your_loadout">Your Loadout</a></li></ul>
    <p class="sidebar-section-title" data-i18n="loadouts">Loadouts</p>
    <ul class="sidebar-nav" id="sidebar-loadout-list"></ul>
    <button class="btn-create-loadout" data-i18n="create_new_loadout" onclick="window.location.href='/create-loadout.html'">+ Create New Loadout</button>
    <div class="sidebar-footer"><span class="lang-badge">EN</span></div>
  </aside>
  <main class="main-content">
    <h1 class="page-title" id="ws-title">Workspace</h1>
    <p class="page-subtitle" id="ws-sub"></p>
    <div class="workspace-grid" id="module-grid">
      <div style="color:var(--text-muted)">Loading modules...</div>
    </div>
  </main>
</div>

<!-- Module icons inline SVGs -->
<template id="icon-calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></template>
<template id="icon-package"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg></template>
<template id="icon-layout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></template>
<template id="icon-user"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0"/></svg></template>
<template id="icon-list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></template>
<template id="icon-clock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></template>
<template id="icon-check-square"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></template>

<script>
const MODULE_ROUTES = {
  'Room Booking':       'room-booking',
  'Asset Tracking':     'asset-tracking',
  'Seat Allocation':    'seat-allocation',
  'Profile Management': 'profile-management',
  'Queueing':           'queueing',
  'Team Schedule':      'team-schedule',
  'Work Tracking':      'work-tracking'
};

document.addEventListener('DOMContentLoaded', async () => {
  initAccountPopup();
  const params = new URLSearchParams(location.search);
  const id = parseInt(params.get('id'));
  if (!id) { window.location.href = '/dashboard.html'; return; }

  const loadouts = await App.getLoadouts();
  const sb = document.getElementById('sidebar-loadout-list');
  sb.innerHTML = loadouts.map(l => `<li><a href="/workspace.html?id=${l.id}"${l.id===id?' class="active"':''}>${escHtml(l.name)}</a></li>`).join('');

  const loadout = await App.getLoadout(id);
  if (!loadout) { window.location.href = '/dashboard.html'; return; }

  document.getElementById('ws-title').textContent = loadout.name;
  document.title = loadout.name + ' — MODIULD';

  const grid = document.getElementById('module-grid');
  grid.innerHTML = '';
  const modules = loadout.modules || [];
  if (!modules.length) {
    grid.innerHTML = '<p style="color:var(--text-muted)">No modules added. <a href="/create-loadout.html?edit=' + id + '" style="color:var(--accent-teal)">Edit Loadout</a></p>';
    return;
  }
  modules.forEach(m => {
    const route = MODULE_ROUTES[m.name] || '';
    const tpl = document.getElementById('icon-' + (m.icon || 'list'));
    const iconHTML = tpl ? tpl.innerHTML : '';
    const card = document.createElement('div');
    card.className = 'module-card';
    card.innerHTML = `
      <div class="module-icon-wrap">${iconHTML}</div>
      <p class="module-name">${escHtml(m.name)}</p>
      <div class="module-btns">
        <button class="btn-view" onclick="openModule('${route}',${id},'view')">View</button>
        <button class="btn-edit-sm" onclick="openModule('${route}',${id},'edit')">Edit</button>
      </div>`;
    grid.appendChild(card);
  });
});

function openModule(route, loadoutId, mode) {
  if (route) window.location.href = '/modules/' + route + '.html?loadout=' + loadoutId + '&mode=' + mode;
}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── Theme radio picker in popup ──────────────────────────────────
(function () {
  const VALID = ['default', 'light', 'dark'];
  function applyTheme(name) {
    const html = document.documentElement;
    html.classList.remove('theme-default', 'theme-light', 'theme-dark');
    html.classList.add('theme-' + name);
    html.setAttribute('data-theme', name);
    localStorage.setItem('modiuld_theme', name);
  }
  const observer = new MutationObserver(() => {
    const saved = localStorage.getItem('modiuld_theme') || 'default';
    const radio = document.getElementById('radio-' + saved);
    if (radio) radio.checked = true;
  });
  const popup = document.getElementById('account-popup');
  if (popup) observer.observe(popup, { attributes: true, attributeFilter: ['class', 'style'] });

  document.querySelectorAll('input[name="popup-theme"]').forEach(r => {
    r.addEventListener('change', () => { if (VALID.includes(r.value)) applyTheme(r.value); });
  });

  const saved = localStorage.getItem('modiuld_theme') || 'default';
  const initRadio = document.getElementById('radio-' + saved);
  if (initRadio) initRadio.checked = true;
})();
</script>
<div id="version-badge" class="version-badge"></div>
</body>
</html>
