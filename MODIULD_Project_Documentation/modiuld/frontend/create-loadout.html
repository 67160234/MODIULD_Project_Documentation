<!DOCTYPE html>
<html lang="en" class="theme-default" data-theme="default">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Loadout — MODIULD</title>
<link rel="icon" href="/frontend/assets/icon1.png">
<link rel="stylesheet" href="/frontend/css/style.css?v=3">
<script src="/frontend/js/theme.js?v=3" defer></script>
<script src="/frontend/js/auth.js?v=3" defer></script>
<script src="/frontend/js/app.js?v=3" defer></script>
<script src="/frontend/js/version.js?v=3" defer></script>
<script src="/frontend/js/lang.js?v=3" defer></script>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="/frontend/assets/Moduild_logo.png" alt="MODIULD" class="logo-text" style="width:130px">
      <div class="avatar" id="sidebar-avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></div>
    </div>
    <div class="account-popup" id="account-popup">
      <span class="popup-close" id="popup-close">&#10005;</span>
      <p class="popup-title" data-i18n="account">Account</p>
      <ul class="popup-list"><li><a href="#" id="btn-logout" data-i18n="logout">Logout</a></li></ul>
      <p class="popup-title" data-i18n="color_mode">Color Mode</p>
      <div class="theme-radio-group" id="theme-radio-group">
        <label class="theme-radio-btn" id="lbl-color">
          <input type="radio" name="popup-theme" value="default" id="radio-default">
          <span data-i18n="default">Default</span>
        </label>
        <label class="theme-radio-btn" id="lbl-light">
          <input type="radio" name="popup-theme" value="light" id="radio-light">
          <span data-i18n="light">Light</span>
        </label>
        <label class="theme-radio-btn" id="lbl-dark">
          <input type="radio" name="popup-theme" value="dark" id="radio-dark">
          <span data-i18n="dark">Dark</span>
        </label>
      </div>
      <a href="/settings.html" class="popup-settings-link" data-i18n="color_settings">Color Settings</a>
    </div>
    <p class="sidebar-section-title" data-i18n="menu">Menu</p>
    <ul class="sidebar-nav"><li><a href="/dashboard.html" id="nav-loadout" data-i18n="your_loadout">Your Loadout</a></li></ul>
    <p class="sidebar-section-title" data-i18n="loadouts">Loadouts</p>
    <ul class="sidebar-nav" id="sidebar-loadout-list"></ul>
    <button class="btn-create-loadout" data-i18n="create_new_loadout" onclick="window.location.href='/create-loadout.html'">+ Create New Loadout</button>
    <div class="sidebar-footer"><span class="lang-badge">EN</span></div>
  </aside>
  <main class="main-content">
    <h1 class="page-title" data-i18n="create_loadout_title">Create Loadout</h1>
    <p class="page-subtitle" data-i18n="create_loadout_subtitle">Create and name your loadout.</p>
    <div id="alert-area" class="alert hidden"></div>
    <div class="create-card">
      <div class="create-header-row">
        <div>
          <h2 id="form-heading" data-i18n="loadout_name">Loadout Name</h2>
          <input type="text" id="loadout-name" class="form-control" data-i18n-placeholder="loadout_name_placeholder" placeholder="Loadout Untitled" style="margin-top:12px;max-width:380px">
        </div>
        <div class="create-actions">
          <button class="btn-reset" id="btn-reset" data-i18n="btn_reset">Reset</button>
          <button class="btn-create" id="btn-create" data-i18n="btn_create">Create</button>
        </div>
      </div>
      <div class="ai-box">
        <div class="ai-box-title"><img src="/frontend/assets/icon1.png" alt=""> <span data-i18n="ai_assistant">Feature Recommendation Assistant</span></div>
        <input type="text" class="form-control" id="ai-desc" data-i18n-placeholder="ai_placeholder" placeholder="Enter a description of your task, such as 'Booking details' or 'Patient records'.">
      </div>
      <div id="modules-area"></div>
    </div>
  </main>
</div>
<script>
const CATEGORIES = ['Space and Resources','Personnel and Teams'];
let allModules = [];
let selectedIds = new Set();
let editingId = null;

document.addEventListener('DOMContentLoaded', async () => {
  initAccountPopup();
  // Load sidebar loadouts
  const loadouts = await App.getLoadouts();
  const sb = document.getElementById('sidebar-loadout-list');
  sb.innerHTML = loadouts.map(l => `<li><a href="/workspace.html?id=${l.id}">${escHtml(l.name)}</a></li>`).join('');

  // Load modules
  allModules = await App.getModules();
  renderModules();

  // Check if editing
  const params = new URLSearchParams(location.search);
  if (params.has('edit')) {
    editingId = parseInt(params.get('edit'));
    document.querySelector('.page-title').textContent = 'Edit Loadout';
    document.getElementById('btn-create').textContent = 'Save';
    const loadout = await App.getLoadout(editingId);
    if (loadout) {
      document.getElementById('loadout-name').value = loadout.name;
      document.getElementById('ai-desc').value = loadout.description || '';
      (loadout.modules || []).forEach(m => selectedIds.add(m.id));
      renderModules();
    }
  }
});

function renderModules() {
  const area = document.getElementById('modules-area');
  area.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const mods = allModules.filter(m => m.category === cat);
    if (!mods.length) return;
    const sec = document.createElement('div');
    sec.innerHTML = `<p class="category-title">${escHtml(cat)}</p><div class="module-chips">${
      mods.map(m => `<span class="module-chip${selectedIds.has(m.id)?` selected`:''}" data-id="${m.id}">${escHtml(m.name)}</span>`).join('')
    }</div>`;
    area.appendChild(sec);
  });
  area.querySelectorAll('.module-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const id = parseInt(chip.dataset.id);
      if (selectedIds.has(id)) { selectedIds.delete(id); chip.classList.remove('selected'); }
      else { selectedIds.add(id); chip.classList.add('selected'); }
    });
  });
}

document.getElementById('btn-reset').addEventListener('click', () => {
  document.getElementById('loadout-name').value = '';
  document.getElementById('ai-desc').value = '';
  selectedIds.clear();
  renderModules();
});

document.getElementById('btn-create').addEventListener('click', async () => {
  const alert = document.getElementById('alert-area');
  const name  = document.getElementById('loadout-name').value.trim();
  const desc  = document.getElementById('ai-desc').value.trim();
  if (!name) { showAlert(alert,'Loadout name is required.'); return; }
  const btn = document.getElementById('btn-create');
  btn.disabled = true; btn.textContent = 'Saving...';
  let r;
  if (editingId) r = await App.updateLoadout(editingId, name, desc, [...selectedIds]);
  else r = await App.createLoadout(name, desc, [...selectedIds]);
  btn.disabled = false; btn.textContent = editingId ? 'Save' : 'Create';
  if (r.ok) { window.location.href = '/dashboard.html'; }
  else { showAlert(alert, r.data.error || 'Failed to save loadout.'); }
});

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── Theme radio picker in popup ──────────────────────────────────
(function () {
  const VALID = ['default', 'light', 'dark'];
  function applyTheme(name) {
    const html = document.documentElement;
    html.classList.remove('theme-default', 'theme-light', 'theme-dark');
    html.classList.add('theme-' + name);
    html.setAttribute('data-theme', name);
    localStorage.setItem('modiuld_theme', name);
  }
  const observer = new MutationObserver(() => {
    const saved = localStorage.getItem('modiuld_theme') || 'default';
    const radio = document.getElementById('radio-' + saved);
    if (radio) radio.checked = true;
  });
  const popup = document.getElementById('account-popup');
  if (popup) observer.observe(popup, { attributes: true, attributeFilter: ['class', 'style'] });

  document.querySelectorAll('input[name="popup-theme"]').forEach(r => {
    r.addEventListener('change', () => { if (VALID.includes(r.value)) applyTheme(r.value); });
  });

  const saved = localStorage.getItem('modiuld_theme') || 'default';
  const initRadio = document.getElementById('radio-' + saved);
  if (initRadio) initRadio.checked = true;
})();
</script>
<div id="version-badge" class="version-badge"></div>
</body>
</html>
